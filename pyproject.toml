[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crewai-cnp-executor"
version = "0.1.0"
description = "CrewAI executor shim backed by contract-net-router"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "M00C1FER" }]
dependencies = [
  "crewai",
  "contract-net-router @ git+https://github.com/M00C1FER/contract-net-router.git",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
